[project]
name = "easysmart-mcp"
version = "0.1.0"
description = "Read-only MCP server for TP-Link Easy Smart switches: ports, link speeds, error counters, VLANs, settings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nitin Chauhan" }]
keywords = ["mcp", "model-context-protocol", "tplink", "easy-smart", "switch", "vlan", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
# Standard library only: no third-party code runs next to the switch password.
dependencies = []

[project.scripts]
easysmart-mcp = "easysmart_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easysmart_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
